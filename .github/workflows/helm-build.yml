name: Helm compatible Build

on:
  push:
    branches:
      - helm-chart # Runs automatically when you push to your current branch
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest # Blazing fast Intel/AMD GitHub server

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the Server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.server
          push: true
          tags: matthiasnick/sparkyfitness-server:v0.16.4.5-helm0.1
          platforms: linux/amd64 # Bypasses your Pi completely!
